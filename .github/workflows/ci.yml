name: Project CI

on:
  pull_request:
    branches: [dev, staging, main]
  push:
    branches: [dev, staging, main]
  workflow_dispatch:
permissions:
  contents: read

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Check code
        run: ruff check .

      - name: Restore data and model from Azure
        env:
          AZURE_STORAGE_ACCOUNT: ${{ secrets.AZURE_STORAGE_ACCOUNT }}
          AZURE_STORAGE_SAS_TOKEN: ${{ secrets.AZURE_STORAGE_SAS_TOKEN }}
        run: |
          dvc remote modify --local myazure account_name "$AZURE_STORAGE_ACCOUNT"
          dvc remote modify --local myazure sas_token "$AZURE_STORAGE_SAS_TOKEN"
          dvc pull \
            data/processed/wuhan_pm25_observed.csv.dvc \
            data/processed/wuhan_pm25_hourly.csv.dvc \
            data/processed/wuhan_pm25_features.csv.dvc \
            models/random_forest.dvc

      - name: Run tests
        run: python -m pytest -q

      - name: Build Docker image
        run: docker build -t wuhan-pm25-forecast:ci .

  delivery:
    name: Build and verify environment image
    needs: check-and-build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/staging' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    env:
      TARGET_ENV: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
      IMAGE_TAG: wuhan-pm25-forecast:${{ github.ref_name }}-${{ github.sha }}

    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install DVC
        run: python -m pip install dvc==3.67.1 dvc-azure==3.1.1

      - name: Restore data and model from Azure
        env:
          AZURE_STORAGE_ACCOUNT: ${{ secrets.AZURE_STORAGE_ACCOUNT }}
          AZURE_STORAGE_SAS_TOKEN: ${{ secrets.AZURE_STORAGE_SAS_TOKEN }}
        run: |
          dvc remote modify --local myazure account_name "$AZURE_STORAGE_ACCOUNT"
          dvc remote modify --local myazure sas_token "$AZURE_STORAGE_SAS_TOKEN"
          dvc pull \
            data/processed/wuhan_pm25_observed.csv.dvc \
            data/processed/wuhan_pm25_hourly.csv.dvc \
            data/processed/wuhan_pm25_features.csv.dvc \
            models/random_forest.dvc

      - name: Generate environment configuration
        env:
          APP_ENV: ${{ secrets.APP_ENV }}
          APP_TITLE: ${{ secrets.APP_TITLE }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          values = {
              "APP_ENV": os.environ["APP_ENV"],
              "APP_TITLE": os.environ["APP_TITLE"],
          }
          if values["APP_ENV"] != os.environ["TARGET_ENV"]:
              raise ValueError("APP_ENV does not match the deployment environment.")
          for key, value in values.items():
              if not value.strip() or any(c in value for c in "\r\n\0"):
                  raise ValueError(f"Invalid or missing environment setting: {key}")
          Path(".env").write_text(
              "".join(f"{key}={value}\n" for key, value in values.items()),
              encoding="utf-8",
          )
          PY

      - name: Build environment image
        run: docker build -t "$IMAGE_TAG" .

      - name: Verify application inside environment image
        run: |
          docker run --rm --env-file .env "$IMAGE_TAG" python -c '
          import os
          from streamlit.testing.v1 import AppTest
          app = AppTest.from_file("app/streamlit_app.py").run(timeout=120)
          assert len(app.exception) == 0, str(app.exception)
          assert app.title[0].value == os.environ["APP_TITLE"]
          assert any(
              item.value == "运行环境：" + os.environ["APP_ENV"]
              for item in app.caption
          )
          print("Environment application verification passed.")
          '

      - name: Record delivery result
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          image_id = subprocess.check_output(
              ["docker", "image", "inspect", "--format", "{{.Id}}",
               os.environ["IMAGE_TAG"]],
              text=True,
          ).strip()
          result = {
              "environment": os.environ["TARGET_ENV"],
              "commit": os.environ["GITHUB_SHA"],
              "image_tag": os.environ["IMAGE_TAG"],
              "image_id": image_id,
              "application_verification": "passed",
          }
          Path("delivery-summary.json").write_text(
              json.dumps(result, indent=2), encoding="utf-8"
          )
          PY

      - name: Upload delivery record
        uses: actions/upload-artifact@v4
        with:
          name: delivery-${{ env.TARGET_ENV }}-${{ github.sha }}
          path: delivery-summary.json
          retention-days: 30

      - name: Remove temporary environment configuration
        if: always()
        run: rm -f .env
